# Optional HTTPS deployment: docker compose -f compose.yaml -f compose.https.yaml up --build -d
services:
  wret:
    expose:
      - "8080"
  https:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      WRET_DOMAIN: ${WRET_DOMAIN:?Set WRET_DOMAIN to your public DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      wret:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
